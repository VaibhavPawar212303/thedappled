<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, sans-serif">
  <!-- /testing/ui-automation?tool=cypress — the assignment card with a Playwright | Cypress switch.
       Each tool is its own assignment: own progress, own links, own leaderboard. The same switch sits on
       every automation stage card (stage 1-4). The choice is remembered for the next page. -->
  <rect width="1440" height="900" fill="#ffffff"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <g transform="translate(64,22)">
    <rect x="0" y="0" width="6" height="28" rx="2" fill="#0f172a"/>
    <rect x="0" y="0" width="20" height="6" rx="2" fill="#0f172a"/>
    <rect x="0" y="22" width="20" height="6" rx="2" fill="#0f172a"/>
    <rect x="10" y="9" width="8" height="5" rx="2" fill="#3987e5"/>
    <rect x="10" y="15" width="8" height="5" rx="2" fill="#3987e5"/>
    <text x="30" y="21" font-size="20" font-weight="700" fill="#0f172a">Thedappled</text>
  </g>
  <g font-size="15" font-weight="500" fill="#64748b">
    <text x="560" y="42">Courses</text><text x="650" y="42">Books</text><text x="725" y="42">Blogs</text>
    <text x="800" y="42" fill="#047857" font-weight="700">Testing</text><text x="885" y="42">Compiler</text>
  </g>

  <!-- Hero (unchanged, shortened) -->
  <rect x="0" y="72" width="1440" height="250" fill="#f8fafc"/>
  <text x="184" y="122" font-size="14" fill="#64748b">Testing   /   <tspan font-weight="600" fill="#0f172a">UI automation</tspan></text>
  <rect x="184" y="146" width="150" height="26" rx="13" fill="#f3e8ff"/>
  <text x="259" y="164" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Stage 1 · Intermediate</text>
  <text x="184" y="226" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.5">UI automation</text>
  <text x="184" y="270" font-size="18" fill="#64748b">Practice Playwright and Cypress on real forms. Two demo pages are built for you.</text>

  <!-- Assignment card -->
  <rect x="184" y="370" width="1072" height="440" rx="24" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <rect x="208" y="370" width="1024" height="8" fill="#10b981"/>

  <rect x="216" y="410" width="96" height="26" rx="13" fill="#d1fae5"/>
  <text x="264" y="428" font-size="12" font-weight="600" fill="#047857" text-anchor="middle">Assignment</text>

  <!-- NEW: tool switch -->
  <text x="216" y="474" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">CHOOSE YOUR TOOL</text>
  <rect x="216" y="486" width="280" height="44" rx="12" fill="#e2e8f0"/>
  <rect x="220" y="490" width="134" height="36" rx="9" fill="#e2e8f0"/>
  <text x="287" y="513" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">Playwright</text>
  <circle cx="338" cy="508" r="7" fill="#10b981"/><text x="338" y="512" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">✓</text>
  <rect x="358" y="490" width="134" height="36" rx="9" fill="#ffffff"/>
  <text x="425" y="513" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Cypress</text>
  <text x="512" y="513" font-size="13" fill="#64748b">Each tool is a separate assignment with its own leaderboard.</text>

  <text x="216" y="580" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Automate sign in and sign up</text>
  <text x="216" y="614" font-size="16" fill="#64748b">Write a <tspan font-weight="700" fill="#0f172a">Cypress</tspan> script that passes 6 checks on the demo pages.</text>
  <text x="216" y="638" font-size="16" fill="#64748b">Your progress is recorded automatically while your script runs.</text>
  <g font-size="15" font-weight="500" fill="#0f172a">
    <circle cx="226" cy="676" r="10" fill="#d1fae5"/><text x="226" y="680" font-size="11" fill="#047857" text-anchor="middle">✓</text>
    <text x="246" y="681">Sign in: empty form, wrong password, valid login</text>
    <circle cx="226" cy="710" r="10" fill="#d1fae5"/><text x="226" y="714" font-size="11" fill="#047857" text-anchor="middle">✓</text>
    <text x="246" y="715">Sign up: empty form, password mismatch, valid sign up</text>
  </g>

  <!-- Right panel: progress for the selected tool -->
  <rect x="820" y="410" width="404" height="368" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="852" y="438" width="84" height="24" rx="12" fill="#0f172a"/>
  <text x="894" y="455" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Cypress</text>
  <text x="852" y="506" font-size="30" font-weight="800" fill="#0f172a">6 checks</text>
  <text x="852" y="530" font-size="14" fill="#64748b">to complete the assignment</text>
  <rect x="852" y="552" width="340" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="852" y="552" width="113" height="8" rx="4" fill="#10b981"/>
  <text x="852" y="590" font-size="14" font-weight="500" fill="#64748b">In progress — 2 of 6 done</text>
  <rect x="852" y="608" width="340" height="48" rx="10" fill="#059669"/>
  <text x="1022" y="638" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Continue Cypress assignment →</text>
  <text x="1022" y="686" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">View Cypress leaderboard →</text>
  <line x1="852" y1="708" x2="1192" y2="708" stroke="#e2e8f0"/>
  <text x="852" y="736" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">OTHER TOOL</text>
  <text x="852" y="760" font-size="13" fill="#0f172a">Playwright · <tspan font-weight="700" fill="#047857">Completed ✓</tspan></text>

  <!-- Notes -->
  <g font-size="12" fill="#92400e">
    <rect x="184" y="830" width="1072" height="50" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="204" y="852">Switch = links (?tool=playwright | ?tool=cypress), remembered in a cookie. Signed out: switch still works; the CTA is "Create free account".</text>
    <text x="204" y="870">Not started on this tool: "Not started — 0 of 6 done" + "Start Cypress assignment". The ✓ on a tab marks a tool the learner has completed.</text>
  </g>
</svg>
