<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" font-family="Inter, sans-serif">
  <!-- /testing/leaderboard?tool=cypress&stage=ui-automation — rankings are per tool.
       A Playwright | Cypress switch sits above the board tabs; every tab (All tracks + each stage) follows it.
       Manual testing has one board shared by both tools. -->
  <rect width="1440" height="860" fill="#f8fafc"/>
  <rect width="1440" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <g transform="translate(64,22)">
    <rect x="0" y="0" width="6" height="28" rx="2" fill="#0f172a"/>
    <rect x="0" y="0" width="20" height="6" rx="2" fill="#0f172a"/>
    <rect x="0" y="22" width="20" height="6" rx="2" fill="#0f172a"/>
    <rect x="10" y="9" width="8" height="5" rx="2" fill="#3987e5"/>
    <rect x="10" y="15" width="8" height="5" rx="2" fill="#3987e5"/>
    <text x="30" y="21" font-size="20" font-weight="700" fill="#0f172a">Thedappled</text>
  </g>
  <g font-size="15" font-weight="500" fill="#64748b">
    <text x="560" y="42">Courses</text><text x="650" y="42">Books</text><text x="725" y="42">Blogs</text>
    <text x="800" y="42" fill="#047857" font-weight="700">Testing</text><text x="885" y="42">Compiler</text>
  </g>

  <text x="184" y="122" font-size="14" fill="#64748b">Testing   /   <tspan font-weight="600" fill="#0f172a">Leaderboard</tspan></text>
  <text x="184" y="182" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Leaderboard</text>
  <text x="184" y="214" font-size="16" fill="#64748b">Playwright and Cypress are ranked separately.</text>

  <!-- NEW: tool switch -->
  <rect x="976" y="160" width="280" height="44" rx="12" fill="#e2e8f0"/>
  <text x="1047" y="187" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">Playwright</text>
  <rect x="1118" y="164" width="134" height="36" rx="9" fill="#ffffff"/>
  <text x="1185" y="187" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Cypress</text>

  <!-- Board tabs (unchanged, follow the tool) -->
  <g font-size="14" font-weight="600">
    <rect x="184" y="246" width="96" height="36" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="232" y="269" fill="#64748b" text-anchor="middle">All tracks</text>
    <rect x="290" y="246" width="128" height="36" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="354" y="269" fill="#64748b" text-anchor="middle">Manual testing</text>
    <rect x="428" y="246" width="124" height="36" rx="18" fill="#0f172a"/><text x="490" y="269" fill="#fff" text-anchor="middle">UI automation</text>
    <rect x="562" y="246" width="136" height="36" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="630" y="269" fill="#64748b" text-anchor="middle">Framework setup</text>
    <rect x="708" y="246" width="118" height="36" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="767" y="269" fill="#64748b" text-anchor="middle">Page objects</text>
    <rect x="836" y="246" width="124" height="36" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="898" y="269" fill="#64748b" text-anchor="middle">Cross-browser</text>
  </g>

  <rect x="184" y="310" width="1072" height="470" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <text x="216" y="354" font-size="20" font-weight="800" fill="#0f172a">UI automation · Cypress</text>
  <text x="1224" y="354" font-size="14" fill="#64748b" text-anchor="end">31 learners · 12 completed</text>
  <g font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">
    <text x="216" y="396">RANK</text><text x="300" y="396">LEARNER</text><text x="820" y="396">CHECKS</text><text x="1224" y="396" text-anchor="end">TIME</text>
  </g>
  <line x1="216" y1="410" x2="1224" y2="410" stroke="#e2e8f0"/>
  <g font-size="15" fill="#0f172a">
    <text x="216" y="446" font-weight="800">#1</text><text x="300" y="446" font-weight="600">Priya S.</text><text x="820" y="446">6 / 6</text><text x="1224" y="446" text-anchor="end">18 min</text>
    <line x1="216" y1="466" x2="1224" y2="466" stroke="#f1f5f9"/>
    <text x="216" y="502" font-weight="800">#2</text><text x="300" y="502" font-weight="600">Marco T.</text><text x="820" y="502">6 / 6</text><text x="1224" y="502" text-anchor="end">24 min</text>
    <line x1="216" y1="522" x2="1224" y2="522" stroke="#f1f5f9"/>
    <text x="216" y="558" font-weight="800">#3</text><text x="300" y="558" font-weight="600">Aisha K.</text><text x="820" y="558">6 / 6</text><text x="1224" y="558" text-anchor="end">31 min</text>
    <rect x="204" y="580" width="1032" height="48" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="216" y="610" font-weight="800">#4</text><text x="300" y="610" font-weight="700">You</text><text x="820" y="610">2 / 6</text><text x="1224" y="610" text-anchor="end" fill="#64748b">In progress</text>
  </g>
  <rect x="216" y="660" width="1008" height="88" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="240" y="696" font-size="15" font-weight="700" fill="#0f172a">Your Cypress assignment: 2 of 6 verified</text>
  <text x="240" y="722" font-size="13" fill="#64748b">Your Playwright progress is on the Playwright board.</text>
  <rect x="1040" y="684" width="160" height="40" rx="10" fill="#059669"/>
  <text x="1120" y="709" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Continue →</text>

  <g font-size="12" fill="#92400e">
    <rect x="184" y="796" width="1072" height="44" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="204" y="823">Manual testing tab: switch stays visible but the board is shared (note "Manual testing has one board for both tools"). Tool defaults to the remembered choice.</text>
  </g>
</svg>
