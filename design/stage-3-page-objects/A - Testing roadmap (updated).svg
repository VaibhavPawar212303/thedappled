<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Inter, sans-serif">
  <!-- Testing page: roadmap section only. Change = Step 3 card added. -->
  <rect width="1440" height="1000" fill="#ffffff"/>

  <!-- header -->
  <rect width="1440" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <g transform="translate(64,22)">
    <rect x="0" y="0" width="6" height="28" rx="2" fill="#0f172a"/>
    <rect x="0" y="0" width="20" height="6" rx="2" fill="#0f172a"/>
    <rect x="0" y="22" width="20" height="6" rx="2" fill="#0f172a"/>
    <rect x="10" y="9" width="8" height="5" rx="2" fill="#3987e5"/>
    <rect x="10" y="15" width="8" height="5" rx="2" fill="#3987e5"/>
    <text x="30" y="21" font-size="20" font-weight="700" fill="#0f172a">Thedappled</text>
  </g>
  <g font-size="15" font-weight="500" fill="#64748b">
    <text x="560" y="42">Courses</text><text x="650" y="42">Books</text><text x="725" y="42">Blogs</text>
    <text x="800" y="42" fill="#047857" font-weight="700">Testing</text><text x="885" y="42">Compiler</text>
  </g>
  <rect x="1236" y="18" width="140" height="36" rx="10" fill="#2563eb"/>
  <text x="1306" y="41" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Get started</text>

  <!-- section heading -->
  <text x="720" y="160" font-size="38" font-weight="800" fill="#0f172a" text-anchor="middle">Your testing roadmap</text>
  <text x="720" y="198" font-size="18" fill="#64748b" text-anchor="middle">Start with Automation learning — more tracks are on the way.</text>

  <!-- track card -->
  <rect x="336" y="240" width="768" height="700" rx="24" fill="#fff" stroke="#e2e8f0"/>
  <clipPath id="card"><rect x="336" y="240" width="768" height="700" rx="24"/></clipPath>
  <rect x="336" y="240" width="768" height="8" fill="#9333ea" clip-path="url(#card)"/>
  <rect x="368" y="284" width="56" height="56" rx="16" fill="#f3e8ff"/>
  <text x="396" y="320" font-size="24" fill="#7e22ce" text-anchor="middle">⚗</text>
  <text x="440" y="308" font-size="24" font-weight="800" fill="#0f172a">Automation learning</text>
  <text x="440" y="332" font-size="14" fill="#64748b">3 steps</text>
  <rect x="966" y="292" width="106" height="26" rx="13" fill="#f3e8ff"/>
  <text x="1019" y="310" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Intermediate</text>
  <text x="368" y="378" font-size="15" fill="#64748b">Learn Playwright and Cypress by automating real pages, set up the framework the way</text>
  <text x="368" y="400" font-size="15" fill="#64748b">teams do, then structure it with page objects and fixtures.</text>

  <!-- step cards -->
  <g font-size="12">
    <!-- step 1 -->
    <rect x="368" y="428" width="704" height="124" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="390" y="450" width="44" height="44" rx="12" fill="#f3e8ff"/>
    <text x="412" y="479" font-size="18" font-weight="800" fill="#7e22ce" text-anchor="middle">1</text>
    <text x="452" y="462" font-weight="700" fill="#64748b" letter-spacing="0.5">STEP 1</text>
    <text x="452" y="486" font-size="18" font-weight="700" fill="#0f172a">UI automation</text>
    <text x="452" y="512" font-size="14" fill="#64748b">Playwright &amp; Cypress: locators, waits, page objects, debugging.</text>
    <text x="1050" y="530" font-size="14" font-weight="600" fill="#9333ea" text-anchor="end">Start step →</text>

    <!-- step 2 -->
    <rect x="368" y="568" width="704" height="124" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="390" y="590" width="44" height="44" rx="12" fill="#f3e8ff"/>
    <text x="412" y="619" font-size="18" font-weight="800" fill="#7e22ce" text-anchor="middle">2</text>
    <text x="452" y="602" font-weight="700" fill="#64748b" letter-spacing="0.5">STEP 2</text>
    <text x="452" y="626" font-size="18" font-weight="700" fill="#0f172a">Framework setup</text>
    <text x="452" y="652" font-size="14" fill="#64748b">Config and credentials in .env, tests that read them, and the project saved on</text>
    <text x="452" y="672" font-size="14" fill="#64748b">GitHub with secrets.</text>
    <text x="1050" y="670" font-size="14" font-weight="600" fill="#9333ea" text-anchor="end">Start step →</text>

    <!-- step 3 (NEW) -->
    <rect x="368" y="708" width="704" height="124" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="390" y="730" width="44" height="44" rx="12" fill="#f3e8ff"/>
    <text x="412" y="759" font-size="18" font-weight="800" fill="#7e22ce" text-anchor="middle">3</text>
    <text x="452" y="742" font-weight="700" fill="#64748b" letter-spacing="0.5">STEP 3</text>
    <rect x="508" y="730" width="42" height="18" rx="9" fill="#d1fae5"/>
    <text x="529" y="743" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">New</text>
    <text x="452" y="766" font-size="18" font-weight="700" fill="#0f172a">Page objects &amp; fixtures</text>
    <text x="452" y="792" font-size="14" fill="#64748b">Move locators into page classes, share setup with fixtures, keep specs readable.</text>
    <text x="1050" y="810" font-size="14" font-weight="600" fill="#9333ea" text-anchor="end">Start step →</text>
  </g>

  <text x="720" y="900" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">More stages coming soon</text>

  <!-- annotation -->
  <rect x="1130" y="708" width="270" height="92" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="4 4"/>
  <text x="1146" y="734" font-size="13" font-weight="700" fill="#b45309">Change</text>
  <text x="1146" y="756" font-size="12" fill="#92400e">Step 3 card added · "3 steps" count</text>
  <text x="1146" y="776" font-size="12" fill="#92400e">· track blurb mentions page objects</text>
</svg>
