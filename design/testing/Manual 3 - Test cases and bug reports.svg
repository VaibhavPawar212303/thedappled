<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3700" viewBox="0 0 1440 3700" font-family="Inter, sans-serif">
  <!-- /testing/manual-testing/test-cases — Manual testing track, step 3. Lesson with worked examples + 5-question self-check. -->
  <rect width="1440" height="3700" fill="#ffffff"/>

  <!-- nav -->
  <rect width="1440" height="72" fill="#fff"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <rect x="40" y="20" width="32" height="32" rx="8" fill="#0f172a"/><text x="56" y="42" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">D</text>
  <text x="84" y="42" font-size="20" font-weight="800" fill="#0f172a">Thedappled</text>
  <g font-size="15" fill="#475569"><text x="520" y="42">Courses</text><text x="610" y="42">Books</text><text x="685" y="42">Blogs</text><text x="755" y="42" font-weight="700" fill="#047857">Testing</text><text x="840" y="42">Compiler</text></g>

  <!-- HERO -->
  <rect y="72" width="1440" height="360" fill="#f8fafc"/>
  <circle cx="1290" cy="200" r="150" fill="#dbeafe" opacity="0.7"/>
  <text x="140" y="128" font-size="14" fill="#64748b">Testing  /  Manual testing  /  <tspan font-weight="700" fill="#0f172a">Test cases &amp; bug reports</tspan></text>
  <rect x="140" y="152" width="250" height="28" rx="14" fill="#dbeafe"/><text x="156" y="171" font-size="12" font-weight="700" fill="#1d4ed8">Manual testing · Step 3 · Beginner</text>
  <text x="140" y="246" font-size="52" font-weight="800" fill="#0f172a">Test cases &amp; bug reports</text>
  <text x="140" y="290" font-size="19" fill="#475569">Write test cases anyone can run, and bug reports a developer can fix on the</text>
  <text x="140" y="316" font-size="19" fill="#475569">first read — with templates you can copy.</text>
  <text x="140" y="372" font-size="14" fill="#64748b">⏱  About 25 minutes  ·  6 short sections  ·  5-question check at the end</text>

  <!-- SIDEBAR -->
  <rect x="980" y="480" width="320" height="464" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <text x="1008" y="520" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.6">ON THIS PAGE</text>
  <g font-size="14" fill="#334155">
    <rect x="996" y="536" width="4" height="26" rx="2" fill="#2563eb"/><text x="1012" y="554" font-weight="700" fill="#1d4ed8">1. Anatomy of a test case</text>
    <text x="1012" y="590">2. Writing clear steps</text>
    <text x="1012" y="622">3. What goes in a bug report</text>
    <text x="1012" y="654">4. Example bug report</text>
    <text x="1012" y="686">5. Severity vs priority</text>
    <text x="1012" y="718">6. The bug life cycle</text>
    <text x="1012" y="750">7. Check your understanding</text>
  </g>
  <line x1="1008" y1="776" x2="1272" y2="776" stroke="#e2e8f0"/>
  <text x="1008" y="804" font-size="12" font-weight="700" fill="#64748b">PREVIOUS</text>
  <text x="1008" y="828" font-size="14" font-weight="700" fill="#1d4ed8">← 2. Test design techniques</text>
  <text x="1008" y="864" font-size="12" font-weight="700" fill="#64748b">NEXT STEP</text>
  <text x="1008" y="888" font-size="14" font-weight="700" fill="#0f172a">4. Exploratory testing</text>
  <rect x="1008" y="898" width="88" height="20" rx="10" fill="#f1f5f9"/><text x="1052" y="912" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Coming soon</text>

  <!-- 1 anatomy of a test case -->
  <text x="140" y="510" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 1</text>
  <text x="140" y="546" font-size="30" font-weight="800" fill="#0f172a">Anatomy of a test case</text>
  <g font-size="16" fill="#334155"><text x="140" y="584">A test case is one check, written so anyone can run it and get the same answer.</text><text x="140" y="610">Here's a complete one for a sign-in page:</text></g>
  <rect x="140" y="632" width="760" height="420" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <rect x="140" y="632" width="760" height="56" rx="16" fill="#eff6ff"/><rect x="140" y="672" width="760" height="16" fill="#eff6ff"/>
  <text x="164" y="667" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#1d4ed8">TC-LOGIN-003</text>
  <text x="300" y="667" font-size="15" font-weight="700" fill="#0f172a">Wrong password shows the error banner</text>
  <rect x="790" y="652" width="86" height="24" rx="12" fill="#fef3c7"/><text x="833" y="668" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Priority: High</text>
  <g font-size="14">
    <text x="164" y="722" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">PRECONDITIONS</text>
    <text x="164" y="744" fill="#334155">A registered user exists: demo@thedappled.com</text>
    <text x="164" y="784" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">STEPS</text>
    <text x="164" y="808" fill="#334155">1. Open /testing/ui-automation/login</text>
    <text x="164" y="832" fill="#334155">2. Enter demo@thedappled.com in Email</text>
    <text x="164" y="856" fill="#334155">3. Enter WrongPass1 in Password</text>
    <text x="164" y="880" fill="#334155">4. Click Sign in</text>
    <text x="164" y="920" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">EXPECTED RESULT</text>
    <text x="164" y="944" fill="#334155">The banner "Invalid email or password." appears and the user stays on the</text>
    <text x="164" y="966" fill="#334155">sign-in page. The password field is cleared.</text>
    <line x1="164" y1="990" x2="876" y2="990" stroke="#f1f5f9"/>
    <text x="164" y="1022" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">ACTUAL RESULT</text><text x="300" y="1022" fill="#94a3b8">filled in when run</text>
    <text x="620" y="1022" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">STATUS</text>
    <rect x="684" y="1006" width="48" height="22" rx="11" fill="#d1fae5"/><text x="708" y="1021" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Pass</text>
    <rect x="738" y="1006" width="44" height="22" rx="11" fill="#f1f5f9"/><text x="760" y="1021" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Fail</text>
    <rect x="788" y="1006" width="64" height="22" rx="11" fill="#f1f5f9"/><text x="820" y="1021" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Blocked</text>
  </g>

  <!-- 2 clear steps -->
  <text x="140" y="1132" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 2</text>
  <text x="140" y="1168" font-size="30" font-weight="800" fill="#0f172a">Writing clear steps</text>
  <g>
    <rect x="140" y="1196" width="372" height="220" rx="16" fill="#fef2f2" stroke="#fecaca"/>
    <text x="164" y="1230" font-size="14" font-weight="800" fill="#b91c1c">✕  Vague</text>
    <g font-size="14" fill="#7f1d1d"><text x="164" y="1266">Title: Login test</text><text x="164" y="1294">Steps: Try logging in with a bad</text><text x="164" y="1314">password.</text><text x="164" y="1342">Expected: Error shows.</text></g>
    <text x="164" y="1386" font-size="12" fill="#b91c1c">Which page? Which error? What text?</text>
    <rect x="528" y="1196" width="372" height="220" rx="16" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="552" y="1230" font-size="14" font-weight="800" fill="#047857">✓  Specific</text>
    <g font-size="14" fill="#14532d"><text x="552" y="1266">Title: Wrong password shows the</text><text x="552" y="1286">error banner</text><text x="552" y="1314">Steps: exact page, exact data,</text><text x="552" y="1334">one action per step.</text><text x="552" y="1362">Expected: the exact banner text.</text></g>
    <text x="552" y="1396" font-size="12" fill="#047857">Two testers get the same result.</text>
  </g>
  <g font-size="14" fill="#334155">
    <text x="140" y="1452">•  One behaviour per test case — if it fails, you know exactly what broke.</text>
    <text x="140" y="1478">•  Use real test data, not "a valid email".</text>
    <text x="140" y="1504">•  Each case can run on its own — don't rely on the previous case.</text>
  </g>

  <!-- 3 bug report fields -->
  <text x="140" y="1580" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 3</text>
  <text x="140" y="1616" font-size="30" font-weight="800" fill="#0f172a">What goes in a bug report</text>
  <g font-size="14">
    <rect x="140" y="1644" width="244" height="84" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="160" y="1674" font-weight="700" fill="#0f172a">Title</text><text x="160" y="1698" fill="#64748b">What's wrong, where.</text>
    <rect x="398" y="1644" width="244" height="84" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="418" y="1674" font-weight="700" fill="#0f172a">Environment</text><text x="418" y="1698" fill="#64748b">Browser, device, build.</text>
    <rect x="656" y="1644" width="244" height="84" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="676" y="1674" font-weight="700" fill="#1d4ed8">Steps to reproduce</text><text x="676" y="1698" fill="#1e3a8a">The most important part.</text>
    <rect x="140" y="1740" width="244" height="84" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="160" y="1770" font-weight="700" fill="#0f172a">Expected vs actual</text><text x="160" y="1794" fill="#64748b">What should vs did happen.</text>
    <rect x="398" y="1740" width="244" height="84" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="418" y="1770" font-weight="700" fill="#0f172a">Severity &amp; priority</text><text x="418" y="1794" fill="#64748b">Impact and urgency.</text>
    <rect x="656" y="1740" width="244" height="84" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="676" y="1770" font-weight="700" fill="#0f172a">Evidence</text><text x="676" y="1794" fill="#64748b">Screenshot, video, logs.</text>
  </g>

  <!-- 4 example bug report -->
  <text x="140" y="1900" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 4</text>
  <text x="140" y="1936" font-size="30" font-weight="800" fill="#0f172a">Example bug report</text>
  <rect x="140" y="1962" width="760" height="420" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <rect x="140" y="1962" width="760" height="56" rx="16" fill="#fef2f2"/><rect x="140" y="2002" width="760" height="16" fill="#fef2f2"/>
  <text x="164" y="1997" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#b91c1c">BUG-112</text>
  <text x="260" y="1997" font-size="15" font-weight="700" fill="#0f172a">Sign up accepts mismatched passwords</text>
  <rect x="670" y="1982" width="100" height="24" rx="12" fill="#fee2e2"/><text x="720" y="1998" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Severity: Major</text>
  <rect x="776" y="1982" width="100" height="24" rx="12" fill="#fef3c7"/><text x="826" y="1998" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Priority: High</text>
  <g font-size="14">
    <text x="164" y="2052" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">ENVIRONMENT</text><text x="300" y="2052" fill="#334155">Chrome 131 · Windows 11 · build 2026.11.22</text>
    <text x="164" y="2092" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">STEPS TO REPRODUCE</text>
    <text x="164" y="2116" fill="#334155">1. Open /testing/ui-automation/signup</text>
    <text x="164" y="2140" fill="#334155">2. Fill all fields; Password: Test@1234, Confirm: Test@9999</text>
    <text x="164" y="2164" fill="#334155">3. Tick the terms box and click Create account</text>
    <text x="164" y="2204" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">EXPECTED</text>
    <text x="164" y="2228" fill="#334155">"Passwords do not match" error under Confirm password; no account created.</text>
    <text x="164" y="2268" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">ACTUAL</text>
    <text x="164" y="2292" fill="#b91c1c">The success message appears and the account is created.</text>
    <text x="164" y="2332" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">EVIDENCE</text>
    <rect x="300" y="2316" width="196" height="26" rx="8" fill="#f1f5f9"/><text x="314" y="2334" fill="#475569">📎 signup-mismatch.png</text>
    <text x="516" y="2334" fill="#64748b">Reproduces 3 of 3 times.</text>
  </g>

  <!-- 5 severity vs priority -->
  <text x="140" y="2460" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 5</text>
  <text x="140" y="2496" font-size="30" font-weight="800" fill="#0f172a">Severity vs priority</text>
  <g font-size="16" fill="#334155"><text x="140" y="2534"><tspan font-weight="700">Severity</tspan><tspan dx="5">is how badly it breaks the product.</tspan><tspan dx="5" font-weight="700">Priority</tspan><tspan dx="5">is how soon it must be</tspan></text><text x="140" y="2560">fixed. They often match — but not always.</text></g>
  <g font-size="14">
    <rect x="140" y="2584" width="372" height="110" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="160" y="2614" font-size="12" font-weight="800" fill="#b91c1c" letter-spacing="0.5">HIGH SEVERITY · HIGH PRIORITY</text><text x="160" y="2642" fill="#334155">Checkout crashes for every user.</text>
    <rect x="528" y="2584" width="372" height="110" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="548" y="2614" font-size="12" font-weight="800" fill="#c2410c" letter-spacing="0.5">HIGH SEVERITY · LOW PRIORITY</text><text x="548" y="2642" fill="#334155">Crash in a yearly admin export that</text><text x="548" y="2664" fill="#334155">nobody needs until March.</text>
    <rect x="140" y="2706" width="372" height="110" rx="14" fill="#fffbeb" stroke="#fde68a"/><text x="160" y="2736" font-size="12" font-weight="800" fill="#b45309" letter-spacing="0.5">LOW SEVERITY · HIGH PRIORITY</text><text x="160" y="2764" fill="#334155">The company name is misspelled</text><text x="160" y="2786" fill="#334155">on the homepage.</text>
    <rect x="528" y="2706" width="372" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="548" y="2736" font-size="12" font-weight="800" fill="#64748b" letter-spacing="0.5">LOW SEVERITY · LOW PRIORITY</text><text x="548" y="2764" fill="#334155">A footer icon is 2px out of line.</text>
  </g>

  <!-- 6 life cycle -->
  <text x="140" y="2894" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 6</text>
  <text x="140" y="2930" font-size="30" font-weight="800" fill="#0f172a">The bug life cycle</text>
  <rect x="140" y="2956" width="760" height="150" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="160" y="2986" width="96" height="40" rx="20" fill="#eff6ff" stroke="#2563eb"/><text x="208" y="3011" fill="#1d4ed8">New</text>
    <rect x="280" y="2986" width="96" height="40" rx="20" fill="#eff6ff" stroke="#2563eb"/><text x="328" y="3011" fill="#1d4ed8">Assigned</text>
    <rect x="400" y="2986" width="104" height="40" rx="20" fill="#eff6ff" stroke="#2563eb"/><text x="452" y="3011" fill="#1d4ed8">In progress</text>
    <rect x="528" y="2986" width="96" height="40" rx="20" fill="#eff6ff" stroke="#2563eb"/><text x="576" y="3011" fill="#1d4ed8">Fixed</text>
    <rect x="648" y="2986" width="96" height="40" rx="20" fill="#fffbeb" stroke="#d97706"/><text x="696" y="3011" fill="#b45309">Retest</text>
    <rect x="768" y="2986" width="112" height="40" rx="20" fill="#f0fdf4" stroke="#059669"/><text x="824" y="3011" fill="#047857">Closed</text>
  </g>
  <g fill="#94a3b8" font-size="14" text-anchor="middle"><text x="268" y="3012">›</text><text x="388" y="3012">›</text><text x="516" y="3012">›</text><text x="636" y="3012">›</text><text x="756" y="3012">›</text></g>
  <path d="M696 3030 C 696 3080, 452 3080, 452 3032" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M446 3038 l6 -6 l6 6" stroke="#dc2626" stroke-width="2" fill="none"/>
  <text x="574" y="3088" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Reopened — still failing on retest</text>

  <!-- quiz -->
  <rect x="140" y="3160" width="760" height="300" rx="20" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="172" y="3204" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">CHECK YOUR UNDERSTANDING</text>
  <text x="172" y="3236" font-size="22" font-weight="800" fill="#0f172a">5 quick questions</text>
  <text x="868" y="3236" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="end">Pick one answer for each</text>
  <text x="172" y="3282" font-size="16" font-weight="700" fill="#0f172a">1. A typo in the company name on the homepage is usually…</text>
  <g font-size="15">
    <rect x="172" y="3300" width="340" height="44" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="192" y="3327" fill="#334155">High severity, high priority</text>
    <rect x="528" y="3300" width="340" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="548" y="3327" font-weight="700" fill="#1d4ed8">Low severity, high priority</text>
  </g>
  <rect x="172" y="3380" width="140" height="44" rx="10" fill="#2563eb"/><text x="242" y="3408" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Check answers</text>
  <text x="332" y="3408" font-size="13" fill="#64748b">Same shared quiz as steps 1 and 2.</text>

  <!-- bottom nav -->
  <line x1="140" y1="3520" x2="1300" y2="3520" stroke="#e2e8f0"/>
  <text x="140" y="3560" font-size="12" font-weight="700" fill="#64748b">PREVIOUS</text>
  <text x="140" y="3586" font-size="16" font-weight="700" fill="#2563eb">← 2. Test design techniques</text>
  <text x="720" y="3576" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">Back to roadmap</text>
  <text x="1300" y="3560" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">NEXT · COMING SOON</text>
  <text x="1300" y="3586" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="end">4. Exploratory testing</text>
</svg>
