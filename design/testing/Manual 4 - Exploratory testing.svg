<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3640" viewBox="0 0 1440 3640" font-family="Inter, sans-serif">
  <!-- /testing/manual-testing/exploratory — Manual testing track, step 4 (last). Lesson + practice charters + 5-question self-check. -->
  <rect width="1440" height="3640" fill="#ffffff"/>

  <!-- nav -->
  <rect width="1440" height="72" fill="#fff"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <rect x="40" y="20" width="32" height="32" rx="8" fill="#0f172a"/><text x="56" y="42" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">D</text>
  <text x="84" y="42" font-size="20" font-weight="800" fill="#0f172a">Thedappled</text>
  <g font-size="15" fill="#475569"><text x="520" y="42">Courses</text><text x="610" y="42">Books</text><text x="685" y="42">Blogs</text><text x="755" y="42" font-weight="700" fill="#047857">Testing</text><text x="840" y="42">Compiler</text></g>

  <!-- HERO -->
  <rect y="72" width="1440" height="360" fill="#f8fafc"/>
  <circle cx="1290" cy="200" r="150" fill="#dbeafe" opacity="0.7"/>
  <text x="140" y="128" font-size="14" fill="#64748b">Testing  /  Manual testing  /  <tspan font-weight="700" fill="#0f172a">Exploratory testing</tspan></text>
  <rect x="140" y="152" width="250" height="28" rx="14" fill="#dbeafe"/><text x="156" y="171" font-size="12" font-weight="700" fill="#1d4ed8">Manual testing · Step 4 · Beginner</text>
  <text x="140" y="246" font-size="52" font-weight="800" fill="#0f172a">Exploratory testing</text>
  <text x="140" y="290" font-size="19" fill="#475569">Find the bugs no script would: learn the app, design tests and run them at the</text>
  <text x="140" y="316" font-size="19" fill="#475569">same time — guided by a charter and a time-box.</text>
  <text x="140" y="372" font-size="14" fill="#64748b">⏱  About 25 minutes  ·  6 short sections  ·  5-question check at the end</text>

  <!-- SIDEBAR -->
  <rect x="980" y="480" width="320" height="464" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <text x="1008" y="520" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.6">ON THIS PAGE</text>
  <g font-size="14" fill="#334155">
    <rect x="996" y="536" width="4" height="26" rx="2" fill="#2563eb"/><text x="1012" y="554" font-weight="700" fill="#1d4ed8">1. What is exploratory testing?</text>
    <text x="1012" y="590">2. Scripted vs exploratory</text>
    <text x="1012" y="622">3. Write a charter</text>
    <text x="1012" y="654">4. Run a time-boxed session</text>
    <text x="1012" y="686">5. Heuristics to guide you</text>
    <text x="1012" y="718">6. Try it now</text>
    <text x="1012" y="750">7. Check your understanding</text>
  </g>
  <line x1="1008" y1="776" x2="1272" y2="776" stroke="#e2e8f0"/>
  <text x="1008" y="804" font-size="12" font-weight="700" fill="#64748b">PREVIOUS</text>
  <text x="1008" y="828" font-size="14" font-weight="700" fill="#1d4ed8">← 3. Test cases &amp; bug reports</text>
  <text x="1008" y="864" font-size="12" font-weight="700" fill="#64748b">NEXT TRACK</text>
  <text x="1008" y="888" font-size="14" font-weight="700" fill="#7e22ce">Automation: UI automation →</text>

  <!-- 1 -->
  <text x="140" y="510" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 1</text>
  <text x="140" y="546" font-size="30" font-weight="800" fill="#0f172a">What is exploratory testing?</text>
  <g font-size="16" fill="#334155"><text x="140" y="586">You learn the product, design tests and run them at the same time, using what each</text><text x="140" y="612">test shows you to decide the next one. It finds the surprising bugs that scripted</text><text x="140" y="638">test cases miss.</text></g>
  <rect x="140" y="664" width="760" height="80" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><rect x="140" y="664" width="6" height="80" rx="3" fill="#2563eb"/>
  <text x="168" y="698" font-size="15" font-weight="700" fill="#1d4ed8">Not random clicking</text>
  <text x="168" y="724" font-size="15" fill="#1e3a8a">Good exploratory testing has a mission (a charter), a time limit and written notes.</text>

  <!-- 2 compare -->
  <text x="140" y="820" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 2</text>
  <text x="140" y="856" font-size="30" font-weight="800" fill="#0f172a">Scripted vs exploratory</text>
  <rect x="140" y="882" width="760" height="236" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <rect x="140" y="882" width="760" height="44" rx="14" fill="#f8fafc"/><rect x="140" y="912" width="760" height="14" fill="#f8fafc"/>
  <g font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5"><text x="164" y="910"> </text><text x="360" y="910">SCRIPTED</text><text x="630" y="910">EXPLORATORY</text></g>
  <g font-size="14">
    <text x="164" y="958" font-weight="700" fill="#0f172a">Tests designed</text><text x="360" y="958" fill="#475569">Before running them</text><text x="630" y="958" fill="#475569">While running them</text>
    <line x1="164" y1="976" x2="876" y2="976" stroke="#f1f5f9"/>
    <text x="164" y="1004" font-weight="700" fill="#0f172a">Best for</text><text x="360" y="1004" fill="#475569">Known requirements, regression</text><text x="630" y="1004" fill="#475569">New features, unclear specs</text>
    <line x1="164" y1="1022" x2="876" y2="1022" stroke="#f1f5f9"/>
    <text x="164" y="1050" font-weight="700" fill="#0f172a">Finds</text><text x="360" y="1050" fill="#475569">Expected failures</text><text x="630" y="1050" fill="#475569">Unexpected ones</text>
    <line x1="164" y1="1068" x2="876" y2="1068" stroke="#f1f5f9"/>
    <text x="164" y="1096" font-weight="700" fill="#0f172a">Output</text><text x="360" y="1096" fill="#475569">Pass / fail per test case</text><text x="630" y="1096" fill="#475569">Session notes, bugs, questions</text>
  </g>
  <text x="140" y="1148" font-size="15" fill="#475569">Teams use both: scripts for what must keep working, exploration for what nobody thought of.</text>

  <!-- 3 charter -->
  <text x="140" y="1224" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 3</text>
  <text x="140" y="1260" font-size="30" font-weight="800" fill="#0f172a">Write a charter</text>
  <text x="140" y="1298" font-size="16" fill="#334155">A charter is a one-line mission for a session. A simple template:</text>
  <rect x="140" y="1320" width="760" height="64" rx="12" fill="#0f172a"/>
  <text x="164" y="1359" font-family="JetBrains Mono, monospace" font-size="15" fill="#e2e8f0">Explore<tspan dx="9" fill="#93c5fd">&lt;target&gt;</tspan><tspan dx="9">with</tspan><tspan dx="9" fill="#a7f3d0">&lt;resources&gt;</tspan><tspan dx="9">to discover</tspan><tspan dx="9" fill="#fcd34d">&lt;information&gt;</tspan></text>
  <g font-size="14" fill="#334155">
    <rect x="140" y="1400" width="760" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="164" y="1432">Explore<tspan dx="4" font-weight="700">the sign-up form</tspan><tspan dx="4">with</tspan><tspan dx="4" font-weight="700">unusual inputs</tspan><tspan dx="4">to discover</tspan><tspan dx="4" font-weight="700">validation gaps.</tspan></text>
    <rect x="140" y="1462" width="760" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="164" y="1494">Explore<tspan dx="4" font-weight="700">sign-in</tspan><tspan dx="4">with</tspan><tspan dx="4" font-weight="700">a keyboard only</tspan><tspan dx="4">to discover</tspan><tspan dx="4" font-weight="700">accessibility problems.</tspan></text>
    <rect x="140" y="1524" width="760" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="164" y="1556">Explore<tspan dx="4" font-weight="700">the cart</tspan><tspan dx="4">with</tspan><tspan dx="4" font-weight="700">back, refresh and two tabs</tspan><tspan dx="4">to discover</tspan><tspan dx="4" font-weight="700">state bugs.</tspan></text>
  </g>

  <!-- 4 session -->
  <text x="140" y="1652" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 4</text>
  <text x="140" y="1688" font-size="30" font-weight="800" fill="#0f172a">Run a time-boxed session</text>
  <g font-size="14">
    <rect x="140" y="1716" width="244" height="138" rx="14" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="1736" width="36" height="36" rx="10" fill="#dbeafe"/><text x="178" y="1760" font-weight="800" fill="#1d4ed8" text-anchor="middle">1</text><text x="160" y="1798" font-weight="700" fill="#0f172a">Set up</text><text x="160" y="1820" fill="#64748b">Pick a charter and a</text><text x="160" y="1838" fill="#64748b">time-box (45–90 min).</text>
    <rect x="398" y="1716" width="244" height="138" rx="14" fill="#fff" stroke="#e2e8f0"/><rect x="418" y="1736" width="36" height="36" rx="10" fill="#dbeafe"/><text x="436" y="1760" font-weight="800" fill="#1d4ed8" text-anchor="middle">2</text><text x="418" y="1798" font-weight="700" fill="#0f172a">Explore &amp; take notes</text><text x="418" y="1820" fill="#64748b">Stay on the charter; note</text><text x="418" y="1838" fill="#64748b">bugs, questions, ideas.</text>
    <rect x="656" y="1716" width="244" height="138" rx="14" fill="#fff" stroke="#e2e8f0"/><rect x="676" y="1736" width="36" height="36" rx="10" fill="#dbeafe"/><text x="694" y="1760" font-weight="800" fill="#1d4ed8" text-anchor="middle">3</text><text x="676" y="1798" font-weight="700" fill="#0f172a">Debrief</text><text x="676" y="1820" fill="#64748b">Share what you covered,</text><text x="676" y="1838" fill="#64748b">found and still wonder.</text>
  </g>
  <rect x="140" y="1868" width="760" height="230" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <text x="164" y="1896" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">SESSION NOTES · SIGN-UP FORM · 60 MIN</text>
  <g font-size="14">
    <rect x="164" y="1914" width="78" height="22" rx="11" fill="#fee2e2"/><text x="203" y="1929" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">BUG</text><text x="256" y="1930" fill="#334155">Full name accepts 300 characters and breaks the success message layout.</text>
    <rect x="164" y="1950" width="78" height="22" rx="11" fill="#fee2e2"/><text x="203" y="1965" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">BUG</text><text x="256" y="1966" fill="#334155">" demo@x.com" with a leading space is rejected as invalid.</text>
    <rect x="164" y="1986" width="78" height="22" rx="11" fill="#fef3c7"/><text x="203" y="2001" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">QUESTION</text><text x="256" y="2002" fill="#334155">Should emails be case-insensitive? Spec doesn't say.</text>
    <rect x="164" y="2022" width="78" height="22" rx="11" fill="#dbeafe"/><text x="203" y="2037" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">IDEA</text><text x="256" y="2038" fill="#334155">Next session: same form on a phone-width screen.</text>
    <text x="164" y="2074" font-size="12" fill="#64748b">Coverage: all 5 fields, terms box, submit · Not covered: password show/hide</text>
  </g>

  <!-- 5 heuristics -->
  <text x="140" y="2170" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 5</text>
  <text x="140" y="2206" font-size="30" font-weight="800" fill="#0f172a">Heuristics to guide you</text>
  <g font-size="14">
    <rect x="140" y="2232" width="244" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="160" y="2264" font-weight="700" fill="#0f172a">Goldilocks</text><text x="160" y="2288" fill="#64748b">Too small, too big,</text><text x="160" y="2308" fill="#64748b">just right — for every input.</text>
    <rect x="398" y="2232" width="244" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="418" y="2264" font-weight="700" fill="#0f172a">Interrupt</text><text x="418" y="2288" fill="#64748b">Refresh, Back, close the tab,</text><text x="418" y="2308" fill="#64748b">lose the network mid-flow.</text>
    <rect x="656" y="2232" width="244" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="676" y="2264" font-weight="700" fill="#0f172a">CRUD</text><text x="676" y="2288" fill="#64748b">Create, read, update and</text><text x="676" y="2308" fill="#64748b">delete every kind of data.</text>
    <rect x="140" y="2354" width="244" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="160" y="2386" font-weight="700" fill="#0f172a">Personas</text><text x="160" y="2410" fill="#64748b">Be a new user, a power user,</text><text x="160" y="2430" fill="#64748b">an impatient user.</text>
    <rect x="398" y="2354" width="244" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="418" y="2386" font-weight="700" fill="#0f172a">Follow the data</text><text x="418" y="2410" fill="#64748b">Enter something, then find</text><text x="418" y="2430" fill="#64748b">everywhere it shows up.</text>
    <rect x="656" y="2354" width="244" height="110" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><text x="676" y="2386" font-weight="700" fill="#0f172a">Error states</text><text x="676" y="2410" fill="#64748b">Trigger every error message</text><text x="676" y="2430" fill="#64748b">and check what comes after.</text>
  </g>

  <!-- 6 try it -->
  <text x="140" y="2542" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 6</text>
  <text x="140" y="2578" font-size="30" font-weight="800" fill="#0f172a">Try it now</text>
  <text x="140" y="2616" font-size="16" fill="#334155">Pick a charter, set a 30-minute timer and explore one of our practice pages.</text>
  <g font-size="14">
    <rect x="140" y="2638" width="760" height="74" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="164" y="2670" font-weight="700" fill="#0f172a">Sign-in page</text><text x="164" y="2692" fill="#64748b">Explore sign-in with wrong, empty and odd inputs to discover unclear errors.</text><text x="876" y="2682" font-weight="700" fill="#2563eb" text-anchor="end">Open page →</text>
    <rect x="140" y="2724" width="760" height="74" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="164" y="2756" font-weight="700" fill="#0f172a">Sign-up page</text><text x="164" y="2778" fill="#64748b">Explore sign-up with unusual inputs to discover validation gaps.</text><text x="876" y="2768" font-weight="700" fill="#2563eb" text-anchor="end">Open page →</text>
    <rect x="140" y="2810" width="760" height="74" rx="14" fill="#fff" stroke="#e2e8f0"/><text x="164" y="2842" font-weight="700" fill="#0f172a">Sign-up, keyboard only</text><text x="164" y="2864" fill="#64748b">Explore sign-up without a mouse to discover focus and accessibility problems.</text><text x="876" y="2854" font-weight="700" fill="#2563eb" text-anchor="end">Open page →</text>
  </g>

  <!-- quiz -->
  <rect x="140" y="2940" width="760" height="300" rx="20" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="172" y="2984" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">CHECK YOUR UNDERSTANDING</text>
  <text x="172" y="3016" font-size="22" font-weight="800" fill="#0f172a">5 quick questions</text>
  <text x="868" y="3016" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="end">Pick one answer for each</text>
  <text x="172" y="3062" font-size="16" font-weight="700" fill="#0f172a">1. Exploratory testing is best described as…</text>
  <g font-size="15">
    <rect x="172" y="3080" width="340" height="44" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="192" y="3107" fill="#334155">Random clicking around</text>
    <rect x="528" y="3080" width="340" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="548" y="3107" font-weight="700" fill="#1d4ed8">Learn, design and run at once</text>
  </g>
  <rect x="172" y="3160" width="140" height="44" rx="10" fill="#2563eb"/><text x="242" y="3188" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Check answers</text>
  <text x="332" y="3188" font-size="13" fill="#64748b">Same shared quiz as the other steps.</text>

  <!-- track complete + bottom nav -->
  <rect x="140" y="3280" width="760" height="120" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="172" y="3322" font-size="13" font-weight="700" fill="#7e22ce" letter-spacing="0.6">MANUAL TESTING TRACK · DONE</text>
  <text x="172" y="3352" font-size="20" font-weight="800" fill="#0f172a">Ready to automate what you just tested by hand?</text>
  <text x="172" y="3378" font-size="14" fill="#64748b">The Automation track starts with the same sign-in and sign-up pages.</text>
  <rect x="700" y="3322" width="176" height="44" rx="10" fill="#7e22ce"/><text x="788" y="3350" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Start UI automation →</text>
  <line x1="140" y1="3460" x2="1300" y2="3460" stroke="#e2e8f0"/>
  <text x="140" y="3500" font-size="12" font-weight="700" fill="#64748b">PREVIOUS</text>
  <text x="140" y="3526" font-size="16" font-weight="700" fill="#2563eb">← 3. Test cases &amp; bug reports</text>
  <text x="720" y="3516" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">Back to roadmap</text>
  <text x="1300" y="3500" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">NEXT TRACK</text>
  <text x="1300" y="3526" font-size="16" font-weight="700" fill="#7e22ce" text-anchor="end">UI automation →</text>
</svg>
