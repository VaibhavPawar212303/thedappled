<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3460" viewBox="0 0 1440 3460" font-family="Inter, sans-serif">
  <!-- /testing/manual-testing/test-design — Manual testing track, step 2. Lesson with worked examples + 5-question self-check. -->
  <rect width="1440" height="3460" fill="#ffffff"/>

  <!-- nav -->
  <rect width="1440" height="72" fill="#fff"/><line x1="0" y1="72" x2="1440" y2="72" stroke="#e2e8f0"/>
  <rect x="40" y="20" width="32" height="32" rx="8" fill="#0f172a"/><text x="56" y="42" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">D</text>
  <text x="84" y="42" font-size="20" font-weight="800" fill="#0f172a">Thedappled</text>
  <g font-size="15" fill="#475569"><text x="520" y="42">Courses</text><text x="610" y="42">Books</text><text x="685" y="42">Blogs</text><text x="755" y="42" font-weight="700" fill="#047857">Testing</text><text x="840" y="42">Compiler</text></g>

  <!-- HERO -->
  <rect y="72" width="1440" height="360" fill="#f8fafc"/>
  <circle cx="1290" cy="200" r="150" fill="#dbeafe" opacity="0.7"/>
  <text x="140" y="128" font-size="14" fill="#64748b">Testing  /  Manual testing  /  <tspan font-weight="700" fill="#0f172a">Test design techniques</tspan></text>
  <rect x="140" y="152" width="250" height="28" rx="14" fill="#dbeafe"/><text x="156" y="171" font-size="12" font-weight="700" fill="#1d4ed8">Manual testing · Step 2 · Beginner</text>
  <text x="140" y="246" font-size="52" font-weight="800" fill="#0f172a">Test design techniques</text>
  <text x="140" y="290" font-size="19" fill="#475569">You can't test everything — so pick the few tests that catch the most bugs.</text>
  <text x="140" y="316" font-size="19" fill="#475569">Five techniques, each with a worked example you can reuse.</text>
  <text x="140" y="372" font-size="14" fill="#64748b">⏱  About 25 minutes  ·  6 short sections  ·  5-question check at the end</text>

  <!-- RIGHT SIDEBAR -->
  <rect x="980" y="480" width="320" height="464" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <text x="1008" y="520" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.6">ON THIS PAGE</text>
  <g font-size="14" fill="#334155">
    <rect x="996" y="536" width="4" height="26" rx="2" fill="#2563eb"/><text x="1012" y="554" font-weight="700" fill="#1d4ed8">1. Why test design?</text>
    <text x="1012" y="590">2. Equivalence partitioning</text>
    <text x="1012" y="622">3. Boundary value analysis</text>
    <text x="1012" y="654">4. Decision tables</text>
    <text x="1012" y="686">5. State transition testing</text>
    <text x="1012" y="718">6. Error guessing</text>
    <text x="1012" y="750">7. Check your understanding</text>
  </g>
  <line x1="1008" y1="776" x2="1272" y2="776" stroke="#e2e8f0"/>
  <text x="1008" y="804" font-size="12" font-weight="700" fill="#64748b">PREVIOUS</text>
  <text x="1008" y="828" font-size="14" font-weight="700" fill="#1d4ed8">← 1. Testing fundamentals</text>
  <text x="1008" y="864" font-size="12" font-weight="700" fill="#64748b">NEXT STEP</text>
  <text x="1008" y="888" font-size="14" font-weight="700" fill="#0f172a">3. Test cases &amp; bug reports</text>
  <rect x="1008" y="898" width="88" height="20" rx="10" fill="#f1f5f9"/><text x="1052" y="912" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Coming soon</text>

  <!-- 1 why -->
  <text x="140" y="510" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 1</text>
  <text x="140" y="546" font-size="30" font-weight="800" fill="#0f172a">Why test design?</text>
  <g font-size="16" fill="#334155">
    <text x="140" y="586">A sign-up form with a few fields already has millions of possible inputs. Test</text>
    <text x="140" y="612">design techniques split that space into groups and edges, so a handful of</text>
    <text x="140" y="638">well-chosen tests gives you confidence that the rest would pass too.</text>
  </g>
  <rect x="140" y="664" width="760" height="80" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><rect x="140" y="664" width="6" height="80" rx="3" fill="#2563eb"/>
  <text x="168" y="698" font-size="15" font-weight="700" fill="#1d4ed8">Black-box techniques</text>
  <text x="168" y="724" font-size="15" fill="#1e3a8a">All five on this page work from the requirements — you don't need to read the code.</text>

  <!-- 2 EP -->
  <text x="140" y="820" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 2</text>
  <text x="140" y="856" font-size="30" font-weight="800" fill="#0f172a">Equivalence partitioning</text>
  <g font-size="16" fill="#334155"><text x="140" y="894">Split inputs into groups the system should treat the same way, then test one value</text><text x="140" y="920">from each group.</text></g>
  <rect x="140" y="944" width="760" height="56" rx="12" fill="#0f172a"/>
  <text x="164" y="978" font-family="JetBrains Mono, monospace" font-size="14" fill="#e2e8f0">Requirement:<tspan fill="#a7f3d0" dx="8">Age must be between 18 and 60.</tspan></text>
  <g font-size="14">
    <rect x="140" y="1016" width="246" height="110" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="160" y="1046" font-weight="700" fill="#b91c1c">Invalid: below 18</text><text x="160" y="1070" fill="#64748b">e.g. 10</text><text x="160" y="1104" font-weight="700" fill="#b91c1c">Expect: error</text>
    <rect x="397" y="1016" width="246" height="110" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/><text x="417" y="1046" font-weight="700" fill="#047857">Valid: 18 to 60</text><text x="417" y="1070" fill="#64748b">e.g. 35</text><text x="417" y="1104" font-weight="700" fill="#047857">Expect: accepted</text>
    <rect x="654" y="1016" width="246" height="110" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="674" y="1046" font-weight="700" fill="#b91c1c">Invalid: above 60</text><text x="674" y="1070" fill="#64748b">e.g. 70</text><text x="674" y="1104" font-weight="700" fill="#b91c1c">Expect: error</text>
  </g>
  <text x="140" y="1156" font-size="15" fill="#475569">3 partitions → 3 tests instead of testing every age.</text>

  <!-- 3 BVA -->
  <text x="140" y="1232" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 3</text>
  <text x="140" y="1268" font-size="30" font-weight="800" fill="#0f172a">Boundary value analysis</text>
  <g font-size="16" fill="#334155"><text x="140" y="1306">Bugs love edges (a "&lt;" written as "&lt;="). Test the values on and just outside</text><text x="140" y="1332">each boundary.</text></g>
  <rect x="140" y="1356" width="760" height="170" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <line x1="180" y1="1440" x2="860" y2="1440" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="300" y="1430" width="400" height="20" rx="10" fill="#bbf7d0"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="270" cy="1440" r="11" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="270" y="1478" fill="#b91c1c">17</text><text x="270" y="1498" font-weight="500" fill="#64748b">just below</text>
    <circle cx="310" cy="1440" r="11" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="318" y="1410" fill="#047857">18</text><text x="318" y="1392" font-weight="500" fill="#64748b">min</text>
    <circle cx="690" cy="1440" r="11" fill="#bbf7d0" stroke="#059669" stroke-width="2"/><text x="682" y="1410" fill="#047857">60</text><text x="682" y="1392" font-weight="500" fill="#64748b">max</text>
    <circle cx="730" cy="1440" r="11" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="730" y="1478" fill="#b91c1c">61</text><text x="730" y="1498" font-weight="500" fill="#64748b">just above</text>
    <text x="500" y="1478" fill="#047857" font-weight="600">valid range</text>
  </g>
  <text x="140" y="1556" font-size="15" fill="#475569">Test 17, 18, 60 and 61. Pair it with equivalence partitioning for full coverage of a range.</text>

  <!-- 4 decision table -->
  <text x="140" y="1632" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 4</text>
  <text x="140" y="1668" font-size="30" font-weight="800" fill="#0f172a">Decision tables</text>
  <g font-size="16" fill="#334155"><text x="140" y="1706">When the result depends on a combination of conditions, list every combination</text><text x="140" y="1732">as a rule — each rule becomes one test.</text></g>
  <rect x="140" y="1756" width="760" height="232" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <rect x="140" y="1756" width="760" height="44" rx="14" fill="#f8fafc"/><rect x="140" y="1786" width="760" height="14" fill="#f8fafc"/>
  <g font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5"><text x="164" y="1784">CONDITIONS / ACTION</text><text x="470" y="1784">RULE 1</text><text x="580" y="1784">RULE 2</text><text x="690" y="1784">RULE 3</text><text x="800" y="1784">RULE 4</text></g>
  <g font-size="14">
    <text x="164" y="1832" font-weight="700" fill="#0f172a">Is a member?</text><text x="488" y="1832" fill="#334155">Yes</text><text x="598" y="1832" fill="#334155">Yes</text><text x="710" y="1832" fill="#334155">No</text><text x="820" y="1832" fill="#334155">No</text>
    <line x1="164" y1="1850" x2="876" y2="1850" stroke="#f1f5f9"/>
    <text x="164" y="1880" font-weight="700" fill="#0f172a">Has a coupon?</text><text x="488" y="1880" fill="#334155">Yes</text><text x="602" y="1880" fill="#334155">No</text><text x="706" y="1880" fill="#334155">Yes</text><text x="820" y="1880" fill="#334155">No</text>
    <line x1="164" y1="1898" x2="876" y2="1898" stroke="#e2e8f0"/>
    <rect x="140" y="1906" width="760" height="74" fill="#eff6ff"/>
    <text x="164" y="1948" font-weight="700" fill="#1d4ed8">→ Discount</text><text x="482" y="1948" font-weight="800" fill="#1d4ed8">20%</text><text x="592" y="1948" font-weight="800" fill="#1d4ed8">10%</text><text x="702" y="1948" font-weight="800" fill="#1d4ed8">10%</text><text x="816" y="1948" font-weight="800" fill="#1d4ed8">0%</text>
  </g>
  <text x="140" y="2018" font-size="15" fill="#475569">2 yes/no conditions → 2 × 2 = 4 rules. Three conditions would give 8.</text>

  <!-- 5 state transition -->
  <text x="140" y="2094" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 5</text>
  <text x="140" y="2130" font-size="30" font-weight="800" fill="#0f172a">State transition testing</text>
  <g font-size="16" fill="#334155"><text x="140" y="2168">Some features behave differently depending on what happened before. Map the</text><text x="140" y="2194">states and the events that move between them, then test each move.</text></g>
  <rect x="140" y="2218" width="760" height="200" rx="16" fill="#fff" stroke="#e2e8f0"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="170" y="2280" width="130" height="56" rx="28" fill="#f0fdf4" stroke="#059669" stroke-width="2"/><text x="235" y="2313" fill="#047857">Active</text>
    <rect x="370" y="2280" width="130" height="56" rx="28" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="435" y="2306" fill="#b45309">1 wrong</text><text x="435" y="2324" font-size="11" font-weight="500" fill="#92400e">attempt</text>
    <rect x="570" y="2280" width="130" height="56" rx="28" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="635" y="2306" fill="#b45309">2 wrong</text><text x="635" y="2324" font-size="11" font-weight="500" fill="#92400e">attempts</text>
    <rect x="740" y="2280" width="130" height="56" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="805" y="2313" fill="#b91c1c">Locked</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="300" y1="2308" x2="364" y2="2308"/><path d="M358 2302 l6 6 l-6 6"/>
    <line x1="500" y1="2308" x2="564" y2="2308"/><path d="M558 2302 l6 6 l-6 6"/>
    <line x1="700" y1="2308" x2="734" y2="2308"/><path d="M728 2302 l6 6 l-6 6"/>
    <path d="M435 2340 C 435 2390, 235 2390, 235 2342" stroke="#059669"/><path d="M229 2348 l6 -6 l6 6" stroke="#059669"/>
  </g>
  <g font-size="12" fill="#64748b" text-anchor="middle"><text x="332" y="2298">wrong</text><text x="532" y="2298">wrong</text><text x="718" y="2270">wrong</text><text x="335" y="2402" fill="#047857">correct password → back to Active</text></g>
  <text x="140" y="2448" font-size="15" fill="#475569">Test every arrow — including "correct password after 2 wrong attempts" and "any password once locked".</text>

  <!-- 6 error guessing -->
  <text x="140" y="2524" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">SECTION 6</text>
  <text x="140" y="2560" font-size="30" font-weight="800" fill="#0f172a">Error guessing</text>
  <text x="140" y="2598" font-size="16" fill="#334155">Use experience of where bugs usually hide. A starter checklist for any input field:</text>
  <g font-size="14" fill="#334155">
    <rect x="140" y="2620" width="372" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="164" y="2650">Empty input / only spaces</text>
    <rect x="528" y="2620" width="372" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="552" y="2650">Very long text (1,000+ characters)</text>
    <rect x="140" y="2680" width="372" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="164" y="2710">Special characters and emoji: ' " &lt; &gt; 😀</text>
    <rect x="528" y="2680" width="372" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="552" y="2710">Leading / trailing spaces in emails</text>
    <rect x="140" y="2740" width="372" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="164" y="2770">Double-clicking a submit button</text>
    <rect x="528" y="2740" width="372" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><text x="552" y="2770">Browser back after submitting</text>
  </g>

  <!-- quiz -->
  <rect x="140" y="2840" width="760" height="420" rx="20" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="172" y="2884" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.6">CHECK YOUR UNDERSTANDING</text>
  <text x="172" y="2916" font-size="22" font-weight="800" fill="#0f172a">5 quick questions</text>
  <text x="868" y="2916" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="end">Pick one answer for each</text>
  <text x="172" y="2962" font-size="16" font-weight="700" fill="#0f172a">1. A field accepts 1–100. Which values does boundary value analysis test?</text>
  <g font-size="15">
    <rect x="172" y="2982" width="696" height="44" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="196" cy="3004" r="8" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="216" y="3009" fill="#334155">1, 50, 100</text>
    <rect x="172" y="3034" width="696" height="44" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><circle cx="196" cy="3056" r="8" fill="#2563eb"/><circle cx="196" cy="3056" r="3" fill="#fff"/><text x="216" y="3061" font-weight="700" fill="#1d4ed8">0, 1, 100, 101</text>
    <rect x="172" y="3086" width="696" height="44" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="196" cy="3108" r="8" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="216" y="3113" fill="#334155">Every value from 1 to 100</text>
    <rect x="172" y="3138" width="696" height="44" rx="10" fill="#fff" stroke="#e2e8f0"/><circle cx="196" cy="3160" r="8" fill="none" stroke="#cbd5e1" stroke-width="2"/><text x="216" y="3165" fill="#334155">-1 and 1,000</text>
  </g>
  <rect x="172" y="3200" width="140" height="44" rx="10" fill="#2563eb"/><text x="242" y="3228" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Check answers</text>
  <text x="332" y="3228" font-size="13" fill="#64748b">Same check as step 1: results and a short explanation under each question.</text>

  <!-- bottom nav -->
  <line x1="140" y1="3320" x2="1300" y2="3320" stroke="#e2e8f0"/>
  <text x="140" y="3360" font-size="12" font-weight="700" fill="#64748b">PREVIOUS</text>
  <text x="140" y="3386" font-size="16" font-weight="700" fill="#2563eb">← 1. Testing fundamentals</text>
  <text x="720" y="3376" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">Back to roadmap</text>
  <text x="1300" y="3360" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">NEXT · COMING SOON</text>
  <text x="1300" y="3386" font-size="16" font-weight="700" fill="#94a3b8" text-anchor="end">3. Test cases &amp; bug reports</text>
</svg>
