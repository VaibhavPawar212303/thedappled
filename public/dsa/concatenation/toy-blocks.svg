<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="t d">
  <title id="t">Copy every toy block twice</title>
  <desc id="d">Three toy blocks, 1, 2 and 1, are each copied twice onto a new shelf that is twice as long: 1 2 1 1 2 1. A small graph shows the moves growing in a straight line with the number of blocks.</desc>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9333EA"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  </defs>
  <rect width="560" height="300" fill="#F8FAFC"/>
  <style>
    .lbl { font: 700 15px Inter, Arial, sans-serif; fill: #475569; }
    .num { font: 800 20px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { font: 600 13px Inter, Arial, sans-serif; fill: #64748B; }
  </style>

  <!-- your blocks -->
  <text x="24" y="30" class="lbl">Your blocks</text>
  <g>
    <!-- block: front face + top face for a toy look -->
    <path d="M44 48 l8 -8 h40 l-8 8 z" fill="#CBD5E1"/><path d="M84 48 l8 -8 v40 l-8 8 z" fill="#94A3B8"/><rect x="44" y="48" width="40" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="64" y="75" class="num" fill="#0F172A">1</text>
    <path d="M104 48 l8 -8 h40 l-8 8 z" fill="#93C5FD"/><path d="M144 48 l8 -8 v40 l-8 8 z" fill="#60A5FA"/><rect x="104" y="48" width="40" height="40" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="124" y="75" class="num" fill="#0F172A">2</text>
    <path d="M164 48 l8 -8 h40 l-8 8 z" fill="#CBD5E1"/><path d="M204 48 l8 -8 v40 l-8 8 z" fill="#94A3B8"/><rect x="164" y="48" width="40" height="40" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="184" y="75" class="num" fill="#0F172A">1</text>
  </g>

  <!-- arrows: each block goes to two places -->
  <path d="M64 92 C 64 125, 46 135, 46 168" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#ab)" opacity="0.55"/>
  <path d="M70 92 C 70 125, 214 135, 214 168" stroke="#9333EA" stroke-width="2" fill="none" marker-end="url(#ap)" opacity="0.55"/>
  <path d="M120 92 C 120 125, 102 135, 102 168" stroke="#2563EB" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <path d="M130 92 C 130 125, 270 135, 270 168" stroke="#9333EA" stroke-width="3" fill="none" marker-end="url(#ap)"/>
  <path d="M180 92 C 180 125, 158 135, 158 168" stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#ab)" opacity="0.55"/>
  <path d="M190 92 C 190 125, 326 135, 326 168" stroke="#9333EA" stroke-width="2" fill="none" marker-end="url(#ap)" opacity="0.55"/>

  <!-- new shelf -->
  <g>
    <rect x="24" y="174" width="44" height="40" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="46" y="201" class="num" fill="#1D4ED8">1</text>
    <rect x="80" y="174" width="44" height="40" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="102" y="201" class="num" fill="#1D4ED8">2</text>
    <rect x="136" y="174" width="44" height="40" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="158" y="201" class="num" fill="#1D4ED8">1</text>
    <rect x="192" y="174" width="44" height="40" rx="4" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="2"/><text x="214" y="201" class="num" fill="#7E22CE">1</text>
    <rect x="248" y="174" width="44" height="40" rx="4" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/><text x="270" y="201" class="num" fill="#7E22CE">2</text>
    <rect x="304" y="174" width="44" height="40" rx="4" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="2"/><text x="326" y="201" class="num" fill="#7E22CE">1</text>
  </g>
  <!-- shelf plank -->
  <rect x="16" y="216" width="340" height="10" rx="3" fill="#B45309"/>
  <rect x="28" y="226" width="8" height="18" fill="#92400E"/><rect x="336" y="226" width="8" height="18" fill="#92400E"/>
  <text x="24" y="266" class="lbl">New shelf: twice as long</text>
  <text x="24" y="284" class="small">first copy in blue, second copy in purple</text>

  <!-- mini graph: moves grow in a straight line -->
  <g transform="translate(396 40)">
    <text x="0" y="-26" class="lbl">More blocks,</text><text x="0" y="-8" class="lbl">more moves</text>
    <line x1="10" y1="140" x2="96" y2="140" stroke="#64748B" stroke-width="2" marker-end="url(#ag)"/>
    <line x1="10" y1="140" x2="10" y2="10" stroke="#64748B" stroke-width="2" marker-end="url(#ag)"/>
    <line x1="10" y1="140" x2="88" y2="24" stroke="#2563EB" stroke-width="3"/>
    <circle cx="24" cy="119" r="4" fill="#2563EB"/>
    <circle cx="49" cy="82" r="4" fill="#2563EB"/>
    <circle cx="80" cy="36" r="4" fill="#2563EB"/>
    <text x="30" y="122" class="small">3 → 6</text>
    <text x="55" y="86" class="small">10 → 20</text>
    <text x="20" y="40" class="small">20 → 40</text>
    <text x="40" y="158" class="small">blocks</text>
    <text x="-2" y="80" class="small" transform="rotate(-90 -2 80)">moves</text>
    <text x="0" y="196" class="lbl" style="fill:#1D4ED8">Straight line: O(n)</text>
  </g>
</svg>
