<svg xmlns="http://www.w3.org/2000/svg" viewBox="-126.4 -98.0 399.6 244.2" width="360" height="220" role="img" aria-label="Find the tallest: walk down the line once and remember the tallest so far"><title>Find the tallest: walk down the line once and remember the tallest so far</title><style>
g,line,polygon,text,rect{transform-box:fill-box}
