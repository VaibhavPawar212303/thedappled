<svg xmlns="http://www.w3.org/2000/svg" viewBox="-147.7 -96.2 391.1 239.0" width="360" height="220" role="img" aria-label="Hash map: each key goes straight to its own bucket, like a dictionary"><title>Hash map: each key goes straight to its own bucket, like a dictionary</title><style>
