<svg xmlns="http://www.w3.org/2000/svg" viewBox="-195.9 -112.1 391.9 239.5" width="360" height="220" role="img" aria-label="Stack: a pile of plates; push adds to the top, pop takes from the top"><title>Stack: a pile of plates; push adds to the top, pop takes from the top</title><style>
g,line,polygon,text,rect{transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.plate{animation:plate 5s ease-in-out infinite}
